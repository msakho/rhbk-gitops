# Allows the router to read the Let's Encrypt certificate issued by cert-manager (certificate.yaml
# in each overlay) and referenced by spec.tls.externalCertificate.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: router-read-rhbk-tls
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    # rhbk-tls-secret: previous certificate (ExternalSecret), kept during the migration to cert-manager
    # so the routes keep working until they switch to rhbk-route-tls. Remove it afterwards.
    resourceNames: ["rhbk-route-tls", "rhbk-tls-secret"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: router-read-rhbk-tls
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: router-read-rhbk-tls
subjects:
  - kind: ServiceAccount
    name: router
    namespace: openshift-ingress
