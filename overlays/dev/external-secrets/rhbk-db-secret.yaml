apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rhbk-db-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-store
  target:
    name: rhbk-db-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: database-username
      remoteRef:
        key: rhbk/dev/db
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: database-password
      remoteRef:
        key: rhbk/dev/db
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
