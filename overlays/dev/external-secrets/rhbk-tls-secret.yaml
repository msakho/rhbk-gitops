apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rhbk-tls-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: CHANGE_ME-secret-store
  target:
    name: rhbk-tls-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt           # fullchain PEM
      remoteRef:
        key: rhbk/dev/tls
        property: tls.crt
    - secretKey: tls.key
      remoteRef:
        key: rhbk/dev/tls
        property: tls.key
