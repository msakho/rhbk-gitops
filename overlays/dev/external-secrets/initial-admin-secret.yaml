apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: initial-admin-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: CHANGE_ME-secret-store
  target:
    name: initial-admin-secret
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: rhbk/dev/bootstrap-admin
        property: username
    - secretKey: password
      remoteRef:
        key: rhbk/dev/bootstrap-admin
        property: password
