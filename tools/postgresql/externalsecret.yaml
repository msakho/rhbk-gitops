# Database credentials for the PostgreSQL pod, read from the same Vault path as the Keycloak
# ExternalSecret rhbk-db-secret (secret/rhbk/<env>/db): one source for both sides.
# __ENV__ is replaced at apply time (see docs/deploiement-gitops.md, annex B).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-db
  labels:
    app: postgresql-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-store
  target:
    name: postgres-db
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        database-name: rhbk
        database-user: "{{ .username }}"
        database-password: "{{ .password }}"
  dataFrom:
    - extract:
        key: rhbk/__ENV__/db
